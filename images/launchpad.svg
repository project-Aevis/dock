    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile4)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    <path d="M 47 24 C 30 24 18 34 18 47 C 18 55 23 62 31 66 L 27 75 L 39 71 C 42 71.5 44.5 72 47 72 C 64 72 76 62 76 47 C 76 34 64 24 47 24 Z" fill="#FFFFFF"/>
