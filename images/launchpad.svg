  <!-- ROW 3 (y = 342) -->
  <!-- ==================================================== -->

  <!-- Tile 7: Photos (x = 76) -->
  <g transform="translate(76, 342)">
    <rect x="1" y="3" width="94" height="94" rx="22" fill="#000000" opacity="0.20"/>
    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile7)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#CBD5E1" stroke-width="1"/>
