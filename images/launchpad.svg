  <g transform="translate(209, 342)">
    <rect x="1" y="3" width="94" height="94" rx="22" fill="#000000" opacity="0.20"/>
    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile8)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    <rect x="22" y="24" width="50" height="46" rx="4" fill="#FFFFFF" opacity="0.95"/>
    <line x1="28" y1="36" x2="66" y2="36" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="46" x2="66" y2="46" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="56" x2="52" y2="56" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Tile 9: Settings (x = 342) -->
  <g transform="translate(342, 342)">
    <rect x="1" y="3" width="94" height="94" rx="22" fill="#000000" opacity="0.20"/>
    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile9)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    <g transform="translate(47, 47)">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-dasharray="10 5"/>
      <circle cx="0" cy="0" r="17" fill="#64748B"/>
      <circle cx="0" cy="0" r="7" fill="#1E293B"/>
    </g>
  </g>
