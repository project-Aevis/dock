    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile2)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    <path d="M 33 28 L 33 42 M 26 35 L 40 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 54 35 L 68 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 28 56 L 38 66 M 38 56 L 28 66" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 54 58 L 68 58 M 54 64 L 68 64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tile 3: Music (x = 342) -->
  <g transform="translate(342, 76)">
    <rect x="1" y="3" width="94" height="94" rx="22" fill="#000000" opacity="0.20"/>
    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile3)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    <ellipse cx="37" cy="65" rx="8" ry="6" fill="#FFFFFF" transform="rotate(-15 37 65)"/>
    <ellipse cx="61" cy="58" rx="8" ry="6" fill="#FFFFFF" transform="rotate(-15 61 58)"/>
    <path d="M 43 62 L 43 32 L 67 25 L 67 55" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
