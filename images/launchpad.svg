<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Apple Squircle Silver-Platinum Aluminum Material -->
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F2F3F6"/>
      <stop offset="65%" stop-color="#DDE1E7"/>
      <stop offset="100%" stop-color="#C2C7D0"/>
    </linearGradient>

    <!-- Top Surface Specular Gloss Luster -->
    <linearGradient id="topLuster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Inset Bevel Stroke -->
    <linearGradient id="bevelRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#B0B6C2" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#7C8492" stop-opacity="0.40"/>
    </linearGradient>

    <!-- Individual Tile Gradients -->
    <!-- Tile 1: Safari / Web (Cyan to Ocean Blue) -->
    <linearGradient id="tile1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Tile 2: Calculator (Vibrant Tangerine Orange) -->
    <linearGradient id="tile2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Tile 3: Music (Vivid Coral Rose) -->
    <linearGradient id="tile3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Tile 4: Messages (Emerald Mint Green) -->
    <linearGradient id="tile4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Tile 5: Podcasts / Entertainment (Deep Violet Purple) -->
    <linearGradient id="tile5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Tile 6: App Store (Electric Cobalt Blue) -->
    <linearGradient id="tile6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
