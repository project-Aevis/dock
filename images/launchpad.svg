    <rect x="1" y="3" width="94" height="94" rx="22" fill="#000000" opacity="0.20"/>
    <rect x="0" y="0" width="94" height="94" rx="22" fill="url(#tile6)"/>
    <rect x="0.5" y="0.5" width="93" height="93" rx="21.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/>
    <path d="M 47 24 L 23 68 M 47 24 L 71 68 M 30 54 L 64 54" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

