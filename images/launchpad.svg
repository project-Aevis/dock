      <ellipse cx="13" cy="-7.5" rx="6.5" ry="12" fill="#F97316" opacity="0.95" transform="rotate(60 13 -7.5)"/>
      <ellipse cx="13" cy="7.5" rx="6.5" ry="12" fill="#EAB308" opacity="0.95" transform="rotate(120 13 7.5)"/>
      <ellipse cx="0" cy="15" rx="6.5" ry="12" fill="#22C55E" opacity="0.95"/>
      <ellipse cx="-13" cy="7.5" rx="6.5" ry="12" fill="#3B82F6" opacity="0.95" transform="rotate(60 -13 7.5)"/>
      <ellipse cx="-13" cy="-7.5" rx="6.5" ry="12" fill="#A855F7" opacity="0.95" transform="rotate(120 -13 -7.5)"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
    </g>
  </g>

