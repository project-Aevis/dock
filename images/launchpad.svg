    <path d="M 33 34 A 18 18 0 0 0 33 46" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 61 34 A 18 18 0 0 1 61 46" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 24 26 A 30 30 0 0 0 24 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 26 A 30 30 0 0 1 70 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

